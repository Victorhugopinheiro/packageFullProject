services:
  frontend:
    build:
      context: ./delivery-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - INTERNAL_API_URL=http://nginx:80
    networks:
      - app-network

  backend:
    build:
      context: ./delivery-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Coolify will inject the environment variables at runtime
    # but for local testing, uncomment the line below:
    env_file: ./delivery-backend/.env
    
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge